# Contributions are accepted under Apache-2.0 with DCO sign-off (spec 12.2).
name: dco

on:
  # Manual trigger, so a run can be re-fired without an empty commit.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sign-off:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha has no DCO sign-off. Use 'git commit -s'."
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          exit $missing
