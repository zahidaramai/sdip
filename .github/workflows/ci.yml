# CI to specification v1.0 section 7.8: every job on every PR, any failure blocks merge.
#
# Jobs whose subject does not exist yet are declared and FAIL LOUDLY with the roadmap
# phase, rather than being silently absent. An absent job looks like a passing one on a
# green check, which is the whole failure mode this project exists to prevent.
#
# CI has no network access except the pinned package index.
name: ci

on:
  # Manual trigger, so a run can be re-fired without an empty commit.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # doctor runs first. If doctor fails, nothing else runs.
  # ---------------------------------------------------------------------------
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Install the publication firewall hook
        run: git config core.hooksPath .githooks
      - name: sdip doctor
        run: uv run sdip doctor
      - name: Publish the doctor report as an artifact
        if: always()
        run: uv run sdip doctor --json > doctor-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-report
          path: doctor-report.json

  lint:
    name: lint / type
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: unit (py${{ matrix.python }})
    needs: doctor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pins intersect at >=3.12,<3.14. See DECISIONS.md D-0001.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --python ${{ matrix.python }}
      - run: uv run pytest tests/unit -v

  # ---------------------------------------------------------------------------
  # Forbid-list enforcement, asserted independently of the Python guard so a bug in
  # the guard cannot hide a violation from CI. Spec section 9.
  # ---------------------------------------------------------------------------
  forbid-list:
    name: forbid-list
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Barred environment variables are absent (spec 9.1)
        run: |
          for v in MDIO_IGNORE_CHECKS MDIO__IMPORT__RAW_HEADERS; do
            if printenv "$v" >/dev/null 2>&1; then
              echo "::error::barred environment variable $v is set (spec 9.1)"; exit 1
            fi
          done

      # Parsed, not grepped. A grep for these names flags the guard's own docstring,
      # this workflow, and every doc that explains why they are barred - and a gate
      # that fires on prose is a gate that gets switched off (DECISIONS.md D-0005).
      - name: SDIP never sets a barred variable
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          from sdip.guard import scan_source_for_barred_assignments
          findings = scan_source_for_barred_assignments(Path("src"))
          findings += scan_source_for_barred_assignments(Path("tests"))
          for f in findings:
              print(f"::error::{f}")
          sys.exit(1 if findings else 0)
          PY

      - name: zfpy is not importable (spec 9.2 / SP3)
        run: |
          uv run python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("zfpy") is not None:
              sys.exit("::error::zfpy is installed - SP3 bars lossy codecs")
          print("zfpy absent")
          PY

      - name: No tolerance-based comparison in the engine (spec 4.5 / 9.5)
        run: uv run pytest tests/unit/test_repository_contract.py -k tolerance -v

      - name: No suppressed warnings (SP6)
        run: uv run pytest tests/unit/test_repository_contract.py -k suppress -v

      - name: The forbid-list detectors have been shown to fire (SP11)
        run: uv run pytest tests/unit -k "actually_detects or negative" -v

  licence:
    name: licence
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: No GPL or AGPL in the runtime dependency tree (spec 3.6 / 9.4)
        run: |
          uv run python - <<'PY'
          import json, sys
          from sdip.guard.licences import check_runtime_licences
          scan = check_runtime_licences()
          print(json.dumps(scan.to_json(), indent=2))
          if not scan.ok:
              sys.exit("::error::runtime dependency tree blocks Apache-2.0 distribution")
          print(f"{len(scan.records)} runtime distributions scanned, clean")
          PY

  # ---------------------------------------------------------------------------
  # Publication firewall. This repository is public. docs/ and every AI-assistant
  # artifact are maintained outside it and must never appear in the index or in
  # ANY commit reachable from any ref.
  #
  # This job does not depend on `doctor`, and does not depend on Python. It must
  # still run when the environment is broken, because a broken environment is
  # exactly when someone force-adds a file to make a check go away.
  # ---------------------------------------------------------------------------
  firewall:
    name: firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nothing unpublishable is tracked at HEAD
        run: |
          tracked=$(git ls-files -- \
            'docs' 'local' 'CLAUDE.md' 'CLAUDE.local.md' 'AGENTS.md' '.claude' \
            '.claude-session-sync.md' '.cursor' '.github/copilot-instructions.md')
          if [ -n "$tracked" ]; then
            echo "::error::tracked and would be published:"
            echo "$tracked" | while read -r f; do echo "::error::  $f"; done
            exit 1
          fi
          echo "firewall intact at HEAD"

      - name: Nothing unpublishable appears anywhere in history
        run: |
          # git rm --cached removes a file from the index and leaves it in every
          # commit that already had it. A clone gets the history, so HEAD being
          # clean is not enough.
          hits=$(git log --all --pretty=format:'%H' --name-only --diff-filter=A -- \
            'docs' 'local' 'CLAUDE.md' 'CLAUDE.local.md' 'AGENTS.md' '.claude' \
            '.claude-session-sync.md' '.cursor' '.github/copilot-instructions.md' \
            | grep -vE '^[0-9a-f]{40}$' | grep -v '^$' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::present in repository HISTORY - a clone would receive these:"
            echo "$hits" | while read -r f; do echo "::error::  $f"; done
            echo "::error::History must be rewritten before this can be published."
            exit 1
          fi
          echo "firewall intact across all history"

  fixture-policy:
    name: fixture-policy
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No proprietary or unattributed data in tests/fixtures (spec 6.6)
        run: |
          test -f tests/fixtures/PROVENANCE.md \
            || { echo "::error::tests/fixtures/PROVENANCE.md is mandatory"; exit 1; }
          undeclared=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f")
            case "$base" in PROVENANCE.md|README.md|.gitkeep|*.py) continue ;; esac
            if ! grep -qF "$base" tests/fixtures/PROVENANCE.md; then
              echo "::error::$f has no entry in tests/fixtures/PROVENANCE.md"; undeclared=1
            fi
          done < <(git ls-files tests/fixtures)
          exit $undeclared

  publication-readiness:
    name: publication-readiness
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unresolved placeholder may reach a public repository
        run: |
          # OPEN_DEBTS D12. The copyright holder and IP provenance are unresolved and
          # are blocking for the first public push. This job is the mechanism that
          # stops the repository being published with the placeholder still in it.
          if grep -rn 'UNRESOLVED-COPYRIGHT-HOLDER' NOTICE CITATION.cff ; then
            echo "::error::NOTICE/CITATION.cff carry an unresolved placeholder - OPEN_DEBTS D12"
            exit 1
          fi
          # `zahidaramai/sdip` was a PLACEHOLDER when this guard was written at F0,
          # before the repository existed. The repository was then created at exactly
          # that name, which made the placeholder real while the guard kept failing on
          # the correct value. Replaced with patterns that are placeholders in every
          # world - including the one that actually bit us: the certificate schema
          # shipped with a literal OWNER in its $id (DECISIONS.md D-0054), which this
          # shape of check would have caught and the old one could not.
          # Split deliberately. A documented EXAMPLE is not an unresolved placeholder:
          # CONTRIBUTING.md teaches the DCO format with `Your Name <you@example.com>`,
          # which is correct prose and must not fail this gate. So the strict tokens are
          # checked everywhere, and `example.com` only where it would be a real defect -
          # machine-read metadata that something resolves against.
          if grep -rInE '(\bOWNER\b|YOUR[-_]ORG|<owner>|XXX-PLACEHOLDER|UNRESOLVED-)' \
               README.md CITATION.cff pyproject.toml CONTRIBUTING.md SECURITY.md \
               src/sdip/schema/*.json ; then
            echo "::error::an unresolved placeholder reached a published file"
            exit 1
          fi
          if grep -rInE 'example\.(com|org)' CITATION.cff pyproject.toml src/sdip/schema/*.json ; then
            echo "::error::example.com reached machine-read metadata"
            exit 1
          fi

          # The canonical URL must name a repository that resolves, not merely be
          # non-placeholder. Checked without network: it must match the git remote.
          REMOTE=$(git config --get remote.origin.url | sed -E 's#.*github\.com[:/]##; s#\.git$##')
          if [ -n "$REMOTE" ] && ! grep -q "$REMOTE" pyproject.toml ; then
            echo "::error::pyproject Homepage does not match the git remote ($REMOTE)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Gate jobs. Each one ARMS ITSELF: it looks for its own subject in the tree and
  # either runs the real check or reports NOT_RUN with its roadmap phase.
  #
  # Why not simply fail while unbuilt. Spec 7.8 says any failure blocks merge, so a
  # job that always fails blocks every PR forever - including the PR that would
  # build it. That is not strictness, it is a broken gate, and a broken gate gets
  # deleted or bypassed, which is worse than a missing one (SP11).
  #
  # Why not simply omit them. An absent job renders as a green check and nobody
  # ever notices the gate does not exist.
  #
  # So: the job exists, runs on every PR, states its status in the run summary, and
  # starts ENFORCING the moment its subject appears - no one has to remember to
  # switch it on. Green here means "everything that exists passes", never "the gates
  # pass". What has and has not been measured is in README.md and OPEN_DEBTS.md D11.
  # ---------------------------------------------------------------------------
  gates:
    name: gates
    needs: doctor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: integration
            phase: F3
            subject: tests/integration/test_*.py
            # -m 'not slow' removes EXACTLY the 63 P7 latency benchmarks and
            # nothing else - verified against the collected set. They assert a
            # chunk shape beats the default at MILLISECOND scale, which is a real
            # comparison on a quiet machine and noise on a shared runner (D39).
            # A flaky gate teaches people to re-run rather than read, so the
            # benchmark runs locally and the correctness legs gate here. The other
            # two `slow` suites - P2 ibm32 fidelity and the D8 hostile corpus - are
            # correctness, live under tests/unit and tests/negative, and still run.
            command: uv run pytest tests/integration -m 'not slow' -v
            note: Lifted round-trip fixture extended to the 240-byte plane; SHA-256 assertion.
          - gate: negative-G7
            phase: F4
            subject: tests/negative/test_*.py
            command: uv run pytest tests/negative -v
            note: >-
              Non-vacuity. Until G7 passes, every certificate the engine issues is
              unvalidated. OPEN_DEBTS D11.
          - gate: portability-G4
            phase: F3
            # Points at tests that EXIST. The old subject, test_portability*.py, has
            # never matched a file, so this gate reported NOT_RUN permanently while G4
            # was in fact covered by 21 tests under other names (D-0079).
            subject: tests/integration/test_p4_crossimpl.py
            command: uv run pytest tests/integration -k 'portability or crossimpl or g4' -v
            note: Store must open with stock zarr and xarray asserting 'mdio' not in sys.modules.
          - gate: spawn-guard
            phase: F2
            subject: tests/integration/test_spawn_guard*.py
            command: uv run pytest tests/integration -k spawn -v
            note: >-
              MDIO's header parser uses a spawn context; a missing __main__ guard kills
              the pool with BrokenProcessPool.
          - gate: determinism-G6
            phase: F3
            # Deliberately left unmatched, and that NOT_RUN is ACCURATE. G6 has no
            # dedicated test: `g6()` is exercised only incidentally inside the
            # full-chain certificate test, and `-k 'determinism or g6'` selects zero.
            # Pointing this gate at that incidental coverage would report a gate as
            # armed when nothing tests it directly. Tracked as D44 (D-0079).
            subject: tests/integration/test_determinism*.py
            command: uv run pytest tests/integration -k determinism -v
            note: NOT_RUN is ACCURATE - G6 has no dedicated test. See OPEN_DEBTS D44.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Is this gate armed?
        id: arm
        run: |
          # shellcheck disable=SC2086
          if compgen -G "${{ matrix.subject }}" > /dev/null; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Report NOT_RUN
        if: steps.arm.outputs.armed == 'false'
        run: |
          {
            echo "### ${{ matrix.gate }} — \`NOT_RUN\` (roadmap phase ${{ matrix.phase }})"
            echo
            echo "No file matches \`${{ matrix.subject }}\`, so this gate has nothing to run."
            echo
            echo "> ${{ matrix.note }}"
            echo
            echo "It arms itself the moment that file appears. Green on this job means"
            echo "*everything that exists passes* — it does **not** mean the gate passes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=${{ matrix.gate }} NOT_RUN::roadmap phase ${{ matrix.phase }} — no subject in tree"

      - name: Run the gate
        if: steps.arm.outputs.armed == 'true'
        run: |
          uv sync --all-extras --dev
          ${{ matrix.command }}

  # Makes the unbuilt gates visible in every run rather than only in a job that
  # printed a notice and went green.
  roadmap:
    name: roadmap
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarise what has and has not been measured
        run: |
          {
            echo "## SDIP roadmap status"
            echo
            echo "Current phase: **F0** — repository skeleton, public-project files, \`sdip doctor\`."
            echo
            echo "| Gate | Phase | State |"
            echo "|---|---|---|"
            for row in \
              "G1 spec completeness|F1|NOT BUILT" \
              "G2 ingest identity|F3|NOT BUILT" \
              "G3 round trip|F3|NOT BUILT" \
              "G4 portability|F3|NOT BUILT" \
              "G5 scale|F6|NOT BUILT — probe P3" \
              "G6 determinism|F3|NOT BUILT" \
              "G7 non-vacuity|F4|**NOT BUILT — OPEN_DEBTS D11**"; do
              IFS='|' read -r g p s <<< "$row"; echo "| $g | $p | $s |"
            done
            echo
            echo "**Until G7 passes, every certificate the engine issues is unvalidated.**"
            echo "Do not publish certificates from an engine whose gates have never been"
            echo "shown to fail. Live debts: \`OPEN_DEBTS.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
